<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Club SATI — Core Team Election</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗳️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1d22; --paper:#f6f4ee; --paper-2:#ece8dc; --line:#d8d2bf;
    --navy:#1b2340; --navy-2:#242c50; --gold:#b8862c; --gold-soft:#e9d9b3;
    --error:#9c3b3b; --ok:#2f6b4f; --radius:6px;
    --serif:'Source Serif 4',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;padding-bottom:60px;}
  .wrap{max-width:680px;margin:0 auto;padding:0 20px;}
  header.top{background:var(--navy);color:var(--paper);padding:40px 20px 32px;border-bottom:6px solid var(--gold);}
  header.top .inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:18px;}
  .club-logo{width:64px;height:64px;object-fit:contain;flex-shrink:0;border-radius:8px;background:#fff;padding:4px;}
  @media (max-width:420px){ .club-logo{width:48px;height:48px;} }
  header.top .eyebrow{font-size:13px;color:var(--gold-soft);margin:0 0 6px;letter-spacing:0.02em;}.club-full-name{
  font-size:15px;
  color:#cfd3e0;
  margin:-4px 0 8px;
  font-weight:500;
}
  header.top h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,6vw,36px);margin:0 0 8px;letter-spacing:-0.01em;}
  header.top p{margin:0;color:#cfd3e0;font-size:15px;max-width:48ch;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px;margin:22px 0;box-shadow:0 1px 2px rgba(27,35,64,0.04);}
  .card h2{font-family:var(--serif);font-size:20px;margin:0 0 4px;color:var(--navy);}
  .card .sub{font-size:13.5px;color:#6b6a63;margin:0 0 18px;}
  label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 5px;}
  input[type=text],input[type=email],select,textarea{width:100%;padding:11px 12px;font-size:15px;font-family:var(--sans);border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);}
  textarea{resize:vertical;min-height:64px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:1px;}
  .position-card h3{font-family:var(--serif);font-size:19px;margin:0;color:var(--navy);}
  .position-card .count{font-size:12.5px;color:#8a887e;margin:2px 0 16px;}
  .nominee-row{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--paper);}
  .nominee-row.chosen{border-color:var(--navy);background:#eef0f6;}
  .nominee-main{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:12px;}
  .nominee-name{font-size:15px;font-weight:500;}
  .nominee-name .tag{display:block;font-size:12px;font-weight:400;color:var(--ok);margin-top:2px;}
  .vote-btn{flex-shrink:0;padding:8px 16px;font-size:13.5px;font-weight:600;border-radius:var(--radius);border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;font-family:var(--sans);}
  .vote-btn:hover{background:var(--navy);color:#fff;}
  .vote-btn.chosen-btn{background:var(--navy);color:#fff;}
  .reason-panel{padding:0 14px 14px;display:none;}
  .reason-panel.open{display:block;}
  .reason-panel p.hint{font-size:12.5px;color:#6b6a63;margin:0 0 6px;}
  .reason-actions{display:flex;gap:8px;margin-top:8px;}
  .reason-actions button{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:var(--radius);cursor:pointer;border:none;}
  .confirm-btn{background:var(--navy);color:#fff;}
  .confirm-btn:hover{background:var(--navy-2);}
  .cancel-btn{background:transparent;color:#6b6a63;border:1px solid var(--line) !important;}
  .reason-preview{padding:0 14px 12px;font-size:13px;color:#4b4a44;}
  .reason-preview .edit-link{color:var(--navy);text-decoration:underline;cursor:pointer;font-weight:600;margin-left:6px;}
  .checkbox-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;background:var(--paper);cursor:pointer;}
  .checkbox-row input{width:auto;margin:0;}
  .checkbox-row.checked{border-color:var(--navy);background:#eef0f6;}
  .position-reason{margin:6px 0 14px 0;display:none;}
  .position-reason.open{display:block;}
  button.primary{width:100%;padding:14px;font-size:15.5px;font-weight:600;background:var(--navy);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;margin-top:22px;font-family:var(--sans);}
  button.primary:hover{background:var(--navy-2);}
  button.primary:disabled{opacity:0.55;cursor:not-allowed;}
  .msg{margin-top:12px;padding:10px 12px;border-radius:var(--radius);font-size:14px;display:none;}
  .msg.show{display:block;}
  .msg.error{background:#fbeaea;color:var(--error);border:1px solid #e6bcbc;}
  .msg.ok{background:#e9f3ee;color:var(--ok);border:1px solid #b9d9c8;}
  .thankyou{text-align:center;padding:50px 20px;}
  .thankyou h2{font-family:var(--serif);font-size:26px;color:var(--navy);}
  .results-link{text-align:center;margin-top:36px;font-size:13px;}
  .results-link a{color:#8a887e;text-decoration:underline;cursor:pointer;margin:0 8px;}
  .tally-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14.5px;}
  .tally-row.winner{font-weight:700;color:var(--navy);}
  .bar-bg{background:var(--paper-2);border-radius:3px;height:8px;margin:4px 0 12px;overflow:hidden;}
  .bar-fill{background:var(--gold);height:100%;}
  .reason-list{margin:0 0 14px;padding-left:18px;font-size:13px;color:#4b4a44;}
  .nom-entry{border-bottom:1px solid var(--paper-2);padding:10px 0;font-size:13.5px;}
  .nom-entry b{color:var(--navy);}
</style>
</head>

    <div id="headerInner">
      <p class="eyebrow">Wiki Club SATI</p>
      <h1>Executive Board Elections</h1>
      <p>South Asia Technical Initiative</p>
    </div>
  </div>
</header>

<div class="wrap" id="app"><div class="card"><p>Loading…</p></div></div>

<div class="results-link">
  <a id="showResultsLink">Organizer results</a>
  <a id="showNominationsLink">Organizer nominations</a>
</div>

<script>
// ---- CONFIGURE THIS ----
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxIwAF5n-1ZqvvDLKqydzZKu7RZlt7DYJ-N9D86OQooWCnK8gPeUqK9852_1M1s3njP/exec";
// -------------------------

const POSITIONS = [
  {key:'eventCoordinator', label:'Event Coordinator'},
  {key:'technologyCoordinator', label:'Technology Coordinator'},
  {key:'managementCoordinator', label:'Management Coordinator'},
  {key:'graphicsBranding', label:'Graphics & Branding Coordinator'},
  {key:'socialMedia', label:'Social Media Coordinator'},
  {key:'finance', label:'Finance Manager'},
  {key:'contentWriting', label:'Content Writer'}
];

const state = {};
let CANDIDATES_BY_POSITION = {};

function setHeader(title, sub){
  document.getElementById('headerInner').innerHTML = `
    <p class="eyebrow">Wiki Club SATI</p>
    <p class="club-full-name">South Asia Technical Initiative</p>
    <h1>${title}</h1>
    <p>${sub}</p>`;}

async function init(){
  try {
    const res = await fetch(WEBAPP_URL + '?action=phase');
    const data = await res.json();
    const phase = data.phase || 'closed';
    if (phase === 'nominate') renderNominationForm();
    else if (phase === 'vote') await renderVotingForm();
    else renderClosed();
  } catch (err){
    document.getElementById('app').innerHTML = '<div class="card"><p>Could not connect. Check back shortly.</p></div>';
  }
}

function renderClosed(){
  setHeader('Executive Board Elections', 'Nothing open right now — check back soon.');
  document.getElementById('app').innerHTML = `
    <div class="card"><h2>No action needed right now</h2>
    <p class="sub">Nominations and voting will be announced by the organizing team.</p></div>`;
}

// ---------------- NOMINATION PHASE ----------------
function renderNominationForm(){
  setHeader('Nominate Yourself', 'Applying for the Core Organizing Team? Pick the position(s) you want and tell us why.');
  const app = document.getElementById('app');
  let html = `
    <div class="card">
      <h2>Your details</h2>
      <label for="name">Full name</label><input type="text" id="name" required>
      <label for="email">Email</label><input type="email" id="email" required>
      <label for="enrollment">Enrollment number</label><input type="text" id="enrollment" required>
      <label for="year">Year</label>
      <select id="year" required><option value="">Select year</option>
        <option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option>
      </select>
    </div>
    <div class="card">
      <h2>Positions you're applying for</h2>
      <p class="sub">Select one or more, and give a short reason for each.</p>`;
  POSITIONS.forEach(pos => {
    html += `
      <div class="checkbox-row" id="crow_${pos.key}">
        <input type="checkbox" id="chk_${pos.key}" data-pos="${pos.key}">
        <span>${pos.label}</span>
      </div>
      <div class="position-reason" id="preason_${pos.key}">
        <textarea id="reason_${pos.key}" placeholder="Why are you a good fit for ${pos.label}?"></textarea>
      </div>`;
  });
  html += `</div>
    <button class="primary" id="submitBtn">Submit nomination</button>
    <div class="msg" id="msgBox"></div>`;
  app.innerHTML = html;

  POSITIONS.forEach(pos => {
    const chk = document.getElementById('chk_' + pos.key);
    chk.addEventListener('change', () => {
      document.getElementById('crow_' + pos.key).classList.toggle('checked', chk.checked);
      document.getElementById('preason_' + pos.key).classList.toggle('open', chk.checked);
    });
  });

  document.getElementById('submitBtn').addEventListener('click', submitNomination);
}

async function submitNomination(){
  const msgBox = document.getElementById('msgBox');
  const btn = document.getElementById('submitBtn');
  msgBox.className = 'msg';

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const enrollment = document.getElementById('enrollment').value.trim();
  const year = document.getElementById('year').value;

  if (!name || !email || !enrollment || !year){
    msgBox.textContent = 'Please fill in your name, email, enrollment number, and year.';
    msgBox.className = 'msg error show'; return;
  }

  const positions = {};
  let any = false;
  for (const pos of POSITIONS){
    const chk = document.getElementById('chk_' + pos.key);
    if (chk.checked){
      const reason = document.getElementById('reason_' + pos.key).value.trim();
      if (!reason){
        msgBox.textContent = `Please add a reason for ${pos.label}.`;
        msgBox.className = 'msg error show'; return;
      }
      positions[pos.key] = reason;
      any = true;
    }
  }
  if (!any){
    msgBox.textContent = 'Select at least one position.';
    msgBox.className = 'msg error show'; return;
  }

  if (localStorage.getItem('wikiclub_nominated_' + enrollment.toLowerCase())){
    msgBox.textContent = 'This browser already submitted a nomination for that enrollment number.';
    msgBox.className = 'msg error show'; return;
  }

  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const res = await fetch(WEBAPP_URL, { method:'POST', body: JSON.stringify({ type:'nomination', name, email, enrollment, year, positions }) });
    const data = await res.json();
    if (data.status === 'ok'){
      localStorage.setItem('wikiclub_nominated_' + enrollment.toLowerCase(), '1');
      document.getElementById('app').innerHTML = `<div class="thankyou"><h2>Nomination received</h2><p>Thanks, ${name.split(' ')[0]} — we'll be in touch.</p></div>`;
    } else if (data.status === 'duplicate'){
      msgBox.textContent = 'A nomination already exists for this enrollment number or email.';
      msgBox.className = 'msg error show'; btn.disabled = false; btn.textContent = 'Submit nomination';
    } else { throw new Error(data.message || 'Unknown error'); }
  } catch (err){
    msgBox.textContent = 'Could not reach the server. Try again.';
    msgBox.className = 'msg error show'; btn.disabled = false; btn.textContent = 'Submit nomination';
  }
}

// ---------------- VOTING PHASE ----------------
async function renderVotingForm(){
  setHeader('Executive Board Elections', 'Vote for a nominee in each position and tell us briefly why.');
  const res = await fetch(WEBAPP_URL + '?action=candidates');
  const data = await res.json();
  CANDIDATES_BY_POSITION = data.candidates || {};

  const app = document.getElementById('app');
  let html = `
    <div class="card">
      <h2>Your details</h2>
      <label for="name">Full name</label><input type="text" id="name" required>
      <label for="email">Email</label><input type="email" id="email" required>
      <label for="enrollment">Enrollment number</label><input type="text" id="enrollment" required>
      <label for="year">Year</label>
      <select id="year" required><option value="">Select year</option>
        <option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option>
      </select>
    </div>`;

  POSITIONS.forEach(pos => {
    const cands = CANDIDATES_BY_POSITION[pos.key] || [];
    if (!cands.length) return;
    html += `<div class="card position-card"><h3>${pos.label}</h3><p class="count">${cands.length} nominee${cands.length>1?'s':''}</p>`;
    cands.forEach((name, i) => {
      const rid = pos.key + '_' + i;
      html += `
        <div class="nominee-row" id="row_${rid}">
          <div class="nominee-main">
            <div class="nominee-name">${name}<span class="tag" id="tag_${rid}"></span></div>
            <button class="vote-btn" id="btn_${rid}" data-pos="${pos.key}" data-name="${name}" data-rid="${rid}">Vote</button>
          </div>
          <div class="reason-panel" id="panel_${rid}">
            <p class="hint">Why are you voting for ${name}?</p>
            <textarea id="reason_${rid}" placeholder="Write a short reason..."></textarea>
            <div class="reason-actions">
              <button class="confirm-btn" data-pos="${pos.key}" data-name="${name}" data-rid="${rid}">Confirm vote</button>
              <button class="cancel-btn" data-rid="${rid}">Cancel</button>
            </div>
          </div>
          <div class="reason-preview" id="preview_${rid}" style="display:none;"></div>
        </div>`;
    });
    html += `</div>`;
  });

  html += `
    <div class="card">
      <h2>Please enter the names of the most deserving candidates</h2>
      <p class="sub">You can include nominated candidates or any other members you think deserve to be on the team.</p>
      <label for="wi_1">Pick 1</label><input type="text" id="wi_1" placeholder="Name">
      <label for="wi_2">Pick 2</label><input type="text" id="wi_2" placeholder="Name">
      <label for="wi_3">Pick 3</label><input type="text" id="wi_3" placeholder="Name">
      <label for="wi_4">Pick 4</label><input type="text" id="wi_4" placeholder="Name">
      <label for="wi_5">Pick 5</label><input type="text" id="wi_5" placeholder="Name">
    </div>
    <button class="primary" id="submitBtn">Cast vote</button><div class="msg" id="msgBox"></div>`;
  app.innerHTML = html;
  attachVoteHandlers();
}

function closeAllPanels(){ document.querySelectorAll('.reason-panel.open').forEach(p => p.classList.remove('open')); }

function attachVoteHandlers(){
  document.querySelectorAll('.vote-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      closeAllPanels();
      const rid = btn.dataset.rid;
      const panel = document.getElementById('panel_' + rid);
      const existing = state[btn.dataset.pos];
      if (existing && existing.candidate === btn.dataset.name) document.getElementById('reason_' + rid).value = existing.reason || '';
      panel.classList.add('open');
    });
  });

  document.querySelectorAll('.confirm-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const posKey = btn.dataset.pos, name = btn.dataset.name, rid = btn.dataset.rid;
      const reason = document.getElementById('reason_' + rid).value.trim();
      if (!reason){ alert('Please enter a short reason for your vote.'); return; }

      document.querySelectorAll(`[id^="row_${posKey}_"]`).forEach(row => {
        row.classList.remove('chosen');
        row.querySelector('.vote-btn').classList.remove('chosen-btn');
        row.querySelector('.vote-btn').textContent = 'Vote';
        row.querySelector('.tag').textContent = '';
        row.querySelector('.reason-preview').style.display = 'none';
      });

      state[posKey] = {candidate:name, reason:reason};
      const row = document.getElementById('row_' + rid);
      row.classList.add('chosen');
      document.getElementById('btn_' + rid).classList.add('chosen-btn');
      document.getElementById('btn_' + rid).textContent = 'Selected';
      document.getElementById('tag_' + rid).textContent = '✓ your pick';
      const preview = document.getElementById('preview_' + rid);
      preview.style.display = 'block';
      preview.innerHTML = `"${reason}"<span class="edit-link" data-rid="${rid}">Edit</span>`;
      preview.querySelector('.edit-link').addEventListener('click', () => { closeAllPanels(); document.getElementById('panel_' + rid).classList.add('open'); });
      document.getElementById('panel_' + rid).classList.remove('open');
    });
  });

  document.querySelectorAll('.cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => document.getElementById('panel_' + btn.dataset.rid).classList.remove('open'));
  });

  document.getElementById('submitBtn').addEventListener('click', submitVote);
}

async function submitVote(){
  const msgBox = document.getElementById('msgBox');
  const btn = document.getElementById('submitBtn');
  msgBox.className = 'msg';

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const enrollment = document.getElementById('enrollment').value.trim();
  const year = document.getElementById('year').value;

  if (!name || !email || !enrollment || !year){
    msgBox.textContent = 'Please fill in your name, email, enrollment number, and year.';
    msgBox.className = 'msg error show'; return;
  }
  if (localStorage.getItem('wikiclub_voted_' + enrollment.toLowerCase())){
    msgBox.textContent = 'This browser already recorded a vote for that enrollment number.';
    msgBox.className = 'msg error show'; return;
  }

  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const writeIns = [1,2,3,4,5]
      .map(n => (document.getElementById('wi_' + n).value || '').trim())
      .filter(v => v.length > 0);

    const res = await fetch(WEBAPP_URL, { method:'POST', body: JSON.stringify({ type:'vote', name, email, enrollment, year, choices: state, writeIns }) });
    const data = await res.json();
    if (data.status === 'ok'){
      localStorage.setItem('wikiclub_voted_' + enrollment.toLowerCase(), '1');
      document.getElementById('app').innerHTML = `<div class="thankyou"><h2>Vote recorded</h2><p>Thanks, ${name.split(' ')[0]} .your ballot has been saved.</p></div>`;
    } else if (data.status === 'duplicate'){
      msgBox.textContent = 'A vote has already been recorded for this enrollment number or email.';
      msgBox.className = 'msg error show'; btn.disabled = false; btn.textContent = 'Cast vote';
    } else { throw new Error(data.message || 'Unknown error'); }
  } catch (err){
    msgBox.textContent = 'Could not reach the voting server. Try again.';
    msgBox.className = 'msg error show'; btn.disabled = false; btn.textContent = 'Cast vote';
  }
}

// ---------------- ADMIN VIEWS ----------------
document.getElementById('showResultsLink').addEventListener('click', async () => {
  const pass = prompt('Organizer passcode:'); if (pass === null) return;
  setHeader('Election Results', 'Live tally, organizer view only.');
  const app = document.getElementById('app');
  app.innerHTML = '<div class="card"><p>Loading…</p></div>';
  try {
    const res = await fetch(WEBAPP_URL + '?action=results&pass=' + encodeURIComponent(pass));
    const data = await res.json();
    if (data.status !== 'ok') { app.innerHTML = `<div class="card"><p>${data.message || 'Unauthorized'}</p></div>`; return; }
    let html = `<div class="card"><h2>Total votes cast</h2><p style="font-size:28px;font-family:var(--serif);color:var(--navy);margin:0;">${data.totalVoters}</p></div>`;
    POSITIONS.forEach(pos => {
      const tally = (data.tally[pos.key] || {}).counts || {};
      const reasons = (data.tally[pos.key] || {}).reasons || {};
      const entries = Object.entries(tally).sort((a,b) => b[1]-a[1]);
      if (!entries.length) return;
      const max = entries[0][1];
      html += `<div class="card"><h2>${pos.label}</h2>`;
      entries.forEach(([cname,count], i) => {
        html += `<div class="tally-row ${i===0?'winner':''}"><span>${cname}</span><span>${count}</span></div><div class="bar-bg"><div class="bar-fill" style="width:${(count/max*100).toFixed(0)}%"></div></div>`;
        const rs = reasons[cname] || [];
        if (rs.length) html += `<ul class="reason-list">` + rs.slice(0,5).map(r => `<li>${r}</li>`).join('') + `</ul>`;
      });
      html += `</div>`;
    });
    const writeIns = data.writeIns || {};
    const wiEntries = Object.entries(writeIns).sort((a,b) => b[1]-a[1]);
    if (wiEntries.length){
      html += `<div class="card"><h2>Write-in suggestions</h2><p class="sub">Names voters typed in, not from the official ballot.</p>`;
      wiEntries.forEach(([n,c]) => { html += `<div class="tally-row"><span>${n}</span><span>${c}</span></div>`; });
      html += `</div>`;
    }

    app.innerHTML = html || '<div class="card"><p>No votes yet.</p></div>';
  } catch (err){ app.innerHTML = '<div class="card"><p>Could not load results.</p></div>'; }
});

document.getElementById('showNominationsLink').addEventListener('click', async () => {
  const pass = prompt('Organizer passcode:'); if (pass === null) return;
  setHeader('Nominations', 'All submissions received so far, organizer view only.');
  const app = document.getElementById('app');
  app.innerHTML = '<div class="card"><p>Loading…</p></div>';
  try {
    const res = await fetch(WEBAPP_URL + '?action=nominations&pass=' + encodeURIComponent(pass));
    const data = await res.json();
    if (data.status !== 'ok') { app.innerHTML = `<div class="card"><p>${data.message || 'Unauthorized'}</p></div>`; return; }
    if (!data.nominations.length) { app.innerHTML = '<div class="card"><p>No nominations yet.</p></div>'; return; }
    let html = `<div class="card"><h2>${data.nominations.length} nomination${data.nominations.length>1?'s':''}</h2>`;
    data.nominations.forEach(n => {
      const posList = Object.keys(n.positions).map(k => {
        const label = (POSITIONS.find(p => p.key===k) || {}).label || k;
        return `<div><b>${label}:</b> ${n.positions[k]}</div>`;
      }).join('');
      html += `<div class="nom-entry"><b>${n.name}</b> — ${n.email} — ${n.enrollment} — ${n.year}${posList}</div>`;
    });
    html += `</div>`;
    app.innerHTML = html;
  } catch (err){ app.innerHTML = '<div class="card"><p>Could not load nominations.</p></div>'; }
});

init();
</script>
